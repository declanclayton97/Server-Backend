<!-- Tuffshop returns form. Paste into the Magento CMS page "returns-form" (HTML Code element). -->
<iframe id="tuff-returns" src="https://server-backend-1i47.onrender.com/returns?embed=1" title="Returns form"
        style="width:100%;border:0;min-height:600px;display:block;" scrolling="no"></iframe>
<script>
(function () {
  var f = document.getElementById('tuff-returns');
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/(server-backend-1i47\.onrender\.com|returns\.tuffshop\.co\.uk)$/.test(e.origin) && e.origin !== location.origin) return;
    var d = e.data || {};
    if (d.tuffReturnsHeight) f.style.height = d.tuffReturnsHeight + 'px';
    if (d.tuffReturnsScrollTop) window.scrollTo({ top: f.getBoundingClientRect().top + window.pageYOffset - 120, behavior: 'smooth' });
  });
})();
</script>
